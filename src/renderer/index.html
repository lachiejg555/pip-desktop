<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI Pet — Desktop Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2433; --panel:#1a1325; --panel2:#251a37; --line:#3a2c4f;
  --txt:#f4e9d8; --mut:#a892c0; --accent:#1a1622; --accent2:#ff8a3c;
  --onA:#1a1208; --onB:#1a1208;
  --bubble:#fff7e8; --bubbleink:#241310;
  --sb:#140e20; --user:#3a2a52;
  --grid:#2a1d3d; --hi:#ffd23f; --green:#7be06a;
  --pxfont:"Press Start 2P",monospace;
  --bodyfont:"VT323",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--bodyfont);background:#0a0e14;
  image-rendering:pixelated}
#screen{position:relative;width:100vw;height:100vh;overflow:hidden;
  background:#06121f center/cover no-repeat;
  image-rendering:auto;}
/* desktop icon */
.dt-icon{position:absolute;top:14px;left:14px;width:74px;text-align:center;color:#fff;
  font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.9);user-select:none;cursor:default}
.dt-icon .ic{width:40px;height:40px;margin:0 auto 4px;display:block;
  background:linear-gradient(145deg,#cfe3ff,#9bbbe8);border-radius:6px;position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,.4)}
.dt-icon .ic:before{content:"";position:absolute;inset:8px 10px 6px;border:2px solid #2f6dd0;
  border-radius:3px 3px 6px 6px;border-top:none}
.dt-icon .ic:after{content:"";position:absolute;top:6px;left:12px;right:12px;height:4px;
  background:#2f6dd0;border-radius:2px}

/* taskbar */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(20,26,38,.82);
  backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;gap:10px;z-index:50}
.tb-apps{display:flex;gap:14px;align-items:center}
.tb-ic{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;font-size:15px;
  cursor:default;transition:transform .12s;background:rgba(255,255,255,.04)}
.tb-ic:hover{transform:translateY(-2px)}
#clock{position:absolute;right:16px;bottom:6px;color:#fff;font-size:12px;line-height:1.25;
  text-align:right;user-select:none}
#clock b{font-weight:500}
.tb-start{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;
  background:linear-gradient(135deg,#2b8aff,#1f6fe0)}
.tb-start i{width:12px;height:12px;display:block;
  background:
    linear-gradient(#fff,#fff) 0 0/5px 5px no-repeat,
    linear-gradient(#fff,#fff) 7px 0/5px 5px no-repeat,
    linear-gradient(#fff,#fff) 0 7px/5px 5px no-repeat,
    linear-gradient(#fff,#fff) 7px 7px/5px 5px no-repeat}

/* PET */
#pet{position:absolute;width:77px;height:77px;z-index:40;cursor:pointer;
  image-rendering:pixelated;
  background-image:var(--sprite);
  background-repeat:no-repeat;
  /* sheet 256x224 -> scaled 2.4x = 614.4x537.6 ; frame 32->76.8 */
  background-size:614.4px 537.6px;
  will-change:left,top,transform;
  filter:drop-shadow(0 6px 5px rgba(0,0,0,.45))}
#pet.flip{transform:scaleX(-1)}

/* speech bubble */
#bubble{position:absolute;z-index:41;max-width:170px;
  background:rgba(20,16,28,.46);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#fdf6ec;padding:6px 9px;border-radius:10px;
  font-family:var(--bodyfont);font-size:14px;line-height:1.12;
  border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 18px rgba(0,0,0,.32);
  opacity:0;transform:translateY(3px);transition:opacity .2s,transform .2s;
  pointer-events:none;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#bubble.show{opacity:1;transform:translateY(0)}
#bubble:after{content:"";position:absolute;bottom:-5px;left:var(--tail,18px);width:10px;height:10px;
  background:rgba(20,16,28,.46);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transform:rotate(45deg);border-radius:0 0 2px 0;
  border-right:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16)}
#bubble .tag{display:block;font-family:var(--bodyfont);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent2);font-weight:400;margin-bottom:4px;line-height:1.3;
  text-shadow:0 1px 2px rgba(0,0,0,.5)}

/* CHAT WINDOW */
#chat{position:absolute;right:14px;bottom:60px;width:520px;height:560px;z-index:60;
  transform-origin:bottom right;
  background:color-mix(in srgb, var(--panel) 55%, transparent);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:16px;overflow:visible;
  display:none;grid-template-columns:146px 1fr;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
  opacity:0;transform:translateY(10px) scale(.73);transition:opacity .18s,transform .18s}
#chat.open{display:grid}
#chat.shown{opacity:1;transform:translateY(0) scale(.75)}
#chat.nosidebar{grid-template-columns:1fr}
#chat.nosidebar .convs{display:none}
#chat.nosidebar .pane{border-radius:16px}
.resize-h{position:absolute;top:-2px;left:-2px;width:18px;height:18px;z-index:80;
  cursor:nwse-resize;border-top:2px solid var(--accent2);border-left:2px solid var(--accent2);
  border-top-left-radius:14px;opacity:0;transition:opacity .15s}
#chat:hover .resize-h{opacity:.5}
.resize-h:hover{opacity:1 !important}

/* left conversations */
.convs{background:rgba(0,0,0,.18);border-right:1px solid var(--line);display:flex;flex-direction:column;
  min-height:0;border-radius:16px 0 0 16px;overflow:hidden}
.convs .hd{padding:15px 13px 10px;display:flex;align-items:center;justify-content:space-between}
.convs .hd b{font-size:15px;color:var(--accent2);letter-spacing:.4px;font-weight:400}
.convs .new{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--accent);
  color:var(--onA);cursor:pointer;display:grid;place-items:center;transition:background .12s}
.convs .new svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.convs .new:hover{background:var(--accent2)}
.convs .list{overflow-y:auto;flex:1;padding:2px 8px 10px}
.conv{padding:7px 9px;border-radius:10px;cursor:pointer;margin-bottom:3px;color:var(--mut);
  line-height:1.15;border:1px solid transparent;display:flex;align-items:center;gap:6px}
.conv .ctxt{flex:1;min-width:0}
.conv .t{color:var(--accent2);font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;letter-spacing:.3px}
.conv .s{font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:#f4f0fa;letter-spacing:.2px}
.conv:hover{background:rgba(255,255,255,.04)}
.conv.active{background:var(--panel2);border-color:var(--line)}
.conv.active .s{color:#ffffff}
.conv.live{margin-bottom:6px}
.conv.live .t{display:flex;align-items:center;gap:6px}
.livedot{width:7px;height:7px;border-radius:50%;background:#ff5f56;flex:0 0 auto;
  box-shadow:0 0 6px #ff5f56;animation:livepulse 1.6s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.pinbtn{flex:0 0 auto;width:20px;height:20px;border:none;background:transparent;cursor:pointer;
  display:grid;place-items:center;padding:0;opacity:.4;transition:opacity .12s}
.conv:hover .pinbtn{opacity:.7}
.pinbtn.pinned{opacity:1}
.pinbtn .pin{width:13px;height:13px;stroke:var(--accent2);fill:none;stroke-width:1.6;
  stroke-linejoin:round;stroke-linecap:round}
.pinbtn .pin.on{fill:var(--accent2)}

#chat,.convs,.pane,.pane .top,.composer,.conv,.msg.bot,.bagboard,.cos,.snack,.hunger .bar,
.winctl .rb,.wc-x,.wc-wheel,.picker{transition:background-color .3s,border-color .3s,color .2s}

/* center pane */
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:transparent;
  border-radius:0 16px 16px 0;overflow:hidden}
.pane .top{height:50px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:9px;padding:0 12px 0 14px;flex:0 0 auto;position:relative}
.pane .top .av{width:34px;height:34px;border-radius:9px;cursor:pointer;
  background:var(--sprite) -24px -30px/501.8px 439px;image-rendering:pixelated;
  background-color:#241a14;border:1px solid var(--line)}
.pane .top .nm{font-size:19px;color:var(--accent2);font-weight:400;letter-spacing:.4px;cursor:pointer}
.pane .top .wc-x{margin-left:auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);color:var(--accent2);cursor:pointer;display:grid;place-items:center;padding:0;
  transition:background-color .14s,color .14s,transform .12s}
.pane .top .wc-x svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.pane .top .wc-x:hover{color:var(--onB);background:var(--accent2);border-color:transparent;transform:rotate(90deg)}
.pane .top .st{font-size:13px;color:var(--green);
  display:flex;align-items:center;gap:5px;letter-spacing:.3px;
  background:rgba(255,255,255,.06);padding:2px 9px 2px 7px;border-radius:20px;line-height:1.6}
.pane .top .st i{width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green)}

/* views */
.view{flex:1;min-height:0;display:none}
.view.on{display:flex;flex-direction:column}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;font-size:17px;line-height:1.25;padding:9px 13px;border-radius:14px;
  letter-spacing:.3px}
.msg.bot{align-self:flex-start;background:var(--panel2);color:var(--txt);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--onA);border-bottom-right-radius:5px}
.composer{flex:0 0 auto;border-top:1px solid var(--line);padding:11px;display:flex;gap:8px}
.composer input{flex:1;background:var(--sb);border:1px solid var(--line);border-radius:11px;
  color:var(--txt);padding:10px 13px;font-size:17px;outline:none;font-family:var(--bodyfont);
  letter-spacing:.3px}
.composer input:focus{border-color:var(--accent)}
.composer input::placeholder{color:var(--accent2);opacity:.8}
.composer button{background:var(--accent);border:none;color:var(--onA);
  font-size:17px;border-radius:11px;padding:0 18px;cursor:pointer;letter-spacing:.4px;
  transition:background .12s}
.composer button:hover{background:var(--accent2)}

/* BAG / COSMETICS view */
.bagwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:18px 20px}
.cats{display:flex;flex-direction:column;align-items:center;gap:6px}
.cat{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--accent2);
  padding:0;transition:background-color .12s,color .12s,border-color .12s}
.cat svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linejoin:round;stroke-linecap:round}
.cat.bone svg,.cat.star svg{fill:currentColor;stroke:none;width:17px;height:17px}
.cat:hover{border-color:var(--accent2)}
.cat.active{background:var(--accent2);color:var(--onB);border-color:transparent}
.catgrid{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;overflow-y:auto;padding:6px 4px 10px}
.inv-top{display:flex;flex-direction:column;align-items:center;gap:14px}
.inv-left{flex:0 0 auto;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;margin-left:-22px}
.preview-row{position:relative;width:187px;height:187px}
.petbox{width:187px;height:187px;border:1px solid var(--line);border-radius:18px;
  background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;overflow:hidden}
.petbig{width:162px;height:162px;background:var(--sprite) 0 -24px/1296px 1134px;image-rendering:pixelated}
.inv-left .hunger{gap:6px;width:187px;max-width:100%}
.inv-left .hunger .lab{font-size:14px}
.inv-left .hunger .bar{height:14px;border-radius:7px}
/* icon column attached to the right edge of the preview box, matching its height */
.inv-iconcol{position:absolute;top:0;left:calc(100% + 12px);height:187px;display:flex;
  flex-direction:column;justify-content:space-between}
.secbtn{width:33px;height:33px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
  color:var(--accent2);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  transition:background-color .12s,color .12s,border-color .12s}
.secbtn .secicon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linejoin:round;stroke-linecap:round}
.secbtn .secicon.fill{fill:currentColor;stroke:none;width:19px;height:19px}
.secbtn:hover{border-color:var(--accent2)}
.secbtn.active{background:var(--accent2);color:var(--onB);border-color:transparent}
.inv-panel{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;
  align-items:center;gap:22px}
.findbtn{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:4px;
  background:var(--accent2);color:var(--onB);border:none;border-radius:10px;
  padding:9px 18px;font-size:13px;font-family:var(--bodyfont);letter-spacing:.3px;cursor:pointer;
  transition:opacity .12s,transform .1s}
.findbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round}
.findbtn:hover{opacity:.9;transform:translateY(-1px)}
.findbtn:disabled{opacity:.55;cursor:default;transform:none}
.invsec{display:flex;flex-direction:column;gap:8px;align-items:center}
.invsec-h{font-size:13px;color:var(--accent2);letter-spacing:.4px;cursor:pointer;
  text-align:center;transition:color .12s}
.invsec-h:hover{opacity:.8}
.invsec-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cositem{width:38px;height:38px;background:rgba(255,255,255,.08);border:1px solid var(--line);
  border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s}
.cositem:hover{border-color:var(--accent2);transform:translateY(-2px)}
.cositem .cosimg{width:22px;height:22px;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges}
.cat-empty{color:var(--mut);font-size:13px;letter-spacing:.2px;padding:3px 2px}

/* BONE / food view */
.food{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
  padding:18px 56px 18px 20px;gap:20px}
.hunger{display:flex;flex-direction:column;gap:7px}
.hunger-top{display:flex;align-items:center;justify-content:space-between}
.hunger .bar{width:100%;height:15px;border-radius:8px;background:var(--sb);overflow:hidden;
  border:1px solid var(--line)}
.hunger .fill{height:100%;background:var(--accent2);
  transition:width .3s;border-radius:8px}
.hunger .lab{font-size:15px;color:var(--accent2);letter-spacing:.2px}
.hunger .lab#hpct{color:var(--accent2)}
.larder{text-align:center}
.larder b{font-size:19px;color:var(--accent2);letter-spacing:.4px;font-weight:400}
.larder .sub{font-size:15px;color:var(--mut);margin-top:6px;line-height:1.3;letter-spacing:.2px;
  max-width:340px;margin-left:auto;margin-right:auto}
.snacks{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-start}
.snack{flex:0 0 auto;width:38px;height:38px;background:rgba(255,255,255,.08);border:1px solid var(--line);
  border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:.12s;position:relative}
.snack:hover:not(.empty){border-color:var(--accent2);transform:translateY(-2px)}
.snack .qty{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;
  background:var(--accent2);color:var(--onB);font-size:10px;font-weight:400;
  display:grid;place-items:center;padding:0 3px;border:2px solid var(--panel);
  box-shadow:0 2px 5px rgba(0,0,0,.4);line-height:1}
.snack.empty .qty{background:var(--line);color:var(--mut)}
.snack .em{width:22px;height:22px;display:block;image-rendering:pixelated;
  image-rendering:crisp-edges}
.snack.empty{opacity:.45;cursor:default}
.forage{margin-top:10px;background:var(--accent);border:none;color:var(--onA);
  border-radius:12px;padding:14px;font-size:18px;cursor:pointer;letter-spacing:.4px;
  font-family:var(--bodyfont);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:background .12s}
.forage:hover{background:var(--accent2)}
.forage:disabled{opacity:.55;cursor:default;background:var(--panel2);color:var(--mut)}
.foodnote{font-size:14px;color:var(--mut);text-align:center;line-height:1.3;letter-spacing:.2px;
  max-width:260px;margin:2px auto 0}

/* right-side window controls (vertical column, sectioned off) */
.winctl{position:absolute;top:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;gap:6px;padding:10px 8px;width:40px;
  border-left:1px solid var(--line);background:var(--sb);border-radius:0 16px 16px 0}
.wc-div{width:16px;height:1px;background:var(--line);margin:1px 0}
.winctl .rb{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--accent2);position:relative;padding:0;
  transition:background-color .12s,color .12s,border-color .12s}
.winctl .rb svg{width:15px;height:15px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linejoin:round;stroke-linecap:round}
.winctl .rb.bone svg{width:16px;height:16px;fill:currentColor;stroke:none}
.winctl .rb:hover{border-color:var(--accent2)}
.winctl .rb.active{color:var(--onB);background:var(--accent2);border-color:transparent}
.winctl .rb .dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;
  background:var(--accent);border:2px solid var(--sb)}
.wc-x{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);
  color:var(--accent2);cursor:pointer;display:grid;place-items:center;padding:0;
  transition:background-color .14s,color .14s,transform .12s}
.wc-x svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.wc-x:hover{color:var(--onB);background:var(--accent2);border-color:transparent;transform:rotate(90deg)}
.wc-x:active{transform:rotate(90deg) scale(.92)}
.wc-wheel{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);cursor:pointer;
  padding:2px;display:grid;place-items:center;background:var(--panel2);transition:transform .12s}
.wc-wheel:hover{transform:scale(1.08) rotate(12deg)}
.wc-wheel .wheel-ic{width:100%;height:100%;border-radius:50%;
  background:conic-gradient(#ff8a8a,#ffc878,#ffe88a,#a0ea8e,#6fd0e6,#7c9eff,#c77cff,#ff86c8,#ff8a8a);
  box-shadow:inset 0 0 0 3px var(--panel2)}

/* color picker popover */
.picker{position:absolute;top:12px;right:48px;z-index:30;width:188px;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;
  box-shadow:0 14px 40px rgba(0,0,0,.55);display:none;flex-direction:column;gap:10px}
.picker.show{display:flex}
.pk-head{font-size:16px;color:var(--accent2);letter-spacing:.3px}
.pk-row{display:flex;flex-direction:column;gap:6px}
.pk-lab{font-size:13px;color:var(--mut);letter-spacing:.3px}
.pk-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.pk-grid .ch{width:100%;aspect-ratio:1;border-radius:5px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);
  transition:transform .1s}
.pk-grid .ch:hover{transform:scale(1.18)}
.pk-grid .ch.sel{border-color:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}

::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:620px){
  #chat{width:calc(100vw - 20px);left:10px;right:10px;height:64vh;grid-template-columns:140px 1fr 48px}
}

/* egg (pre-hatch) */
#egg{position:absolute;z-index:42;width:96px;height:96px;cursor:pointer;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background-repeat:no-repeat;background-position:center;
  background-size:contain;image-rendering:pixelated;

/* ---------- sprite animation ----------
   sheet 256x224, 32px frames, 8 cols, rows:
   0 Idle 1 Idle2 2 Movement 3 Attack 4 Damage 5 Death 6 Sleep
   displayed at 2x (64px). Frames per row vary (some blank) — clamp counts. */
const ROW={IDLE:0,IDLE2:1,WALK:2,ATTACK:3,DAMAGE:4,DEATH:5,SLEEP:6};
const FRAMES={0:6,1:6,2:8,3:8,4:5,5:5,6:8}; // usable frames per row (sheet has trailing blanks on some)
const FW=76.8; // displayed frame size (32px * 2.4)
const pet=document.getElementById('pet');
let anim={row:0,frame:0,fps:6,t:0};
function setAnim(row,fps){ if(anim.row!==row){anim.row=row;anim.frame=0;anim.t=0;} anim.fps=fps||6; }

/* ---------- pet wander state ---------- */
const W=()=>window.innerWidth, Hh=()=>window.innerHeight;
let px=W()*0.4, py=Hh()*0.45, tx=px, ty=py, facing=1;
let mode='egg';      // egg | hatching | flop | intro | wander | gotosleep | summon | docked | sleeping
let hunger=82;          // 0..100
let lastBubble=0, idleTimer=0, repickAt=0;

function pickTarget(){
  const m=70, top=70, bot=Hh()-120;
  tx = m + Math.random()*(W()-2*m);
  ty = top + Math.random()*(bot-top);
  repickAt = performance.now()+ (2600+Math.random()*3200);
}
pickTarget();

/* ---------- egg / hatch ---------- */
let flopUntil=0;                       // timestamp until which the just-hatched flop plays
const HATCH_MS=2550;                   // total length of the hatching gif (17f * 150ms)
const FLOP_MS=1400;                    // legs-up tumble before settling

/* Pip's intro dialogue (P3TS onboarding) — advances on click after hatching */
const INTRO_LINES=[
  "Hi I'm Pip, click me!",
  "nice to meet you!",
  "I'm your personal welded AI companion",
  "welded means all of your data is stored locally to your PC",
  "I can even monitor and act on all your apps and browsers",
  "in other words, I'm the first fully personal and private AI agent :)",
  "I can optionally learn and evolve through a private data network with all the other P3TS.",
  "To one day achieve super intelligence!!!",
  "You can earn P3TS tokens from this data, to sell or buy cosmetics for me!",
  "You can even power me using your PC's idle compute.",
  "Or sell your compute for tokens!",
  "For now, I'm just in demo mode, where I just connect to your Claude to show how I'll function.",
  "The data storing, learning and earning will be coming soon.",
  "Let's get started :D"
];
let introIdx=0;                        // which line we're on
let introLookT=0;                      // timer for idle look-around glances
let introFacingT=0;                    // timer for occasional facing flip while looking around

const eggEl=document.getElementById('egg');
const petEl=document.getElementById('pet');
eggEl.style.backgroundImage='url("'+EGG_IDLE+'")';
petEl.style.display='none';            // pet stays hidden inside the egg
// "hatch me!" bubble floating just above the egg (no name tag pre-hatch)
function eggBubble(){
  if(mode!=='egg') return;
  const b=document.getElementById('bubble');
  b.innerHTML='hatch me!';
  b.classList.add('show');
  const er=eggEl.getBoundingClientRect();
  const bw=b.offsetWidth||90, bh=b.offsetHeight||30;
  // egg art sits in the lower ~60% of the 96px box; anchor the bubble near the visible top of the egg
  const eggTop = er.top + er.height*0.30;
  let bx=er.left+er.width/2-bw/2;
  let by=eggTop-bh+2;                   // hug the egg closely
  bx=Math.max(8,Math.min(W()-bw-8,bx));
  by=Math.max(8,by);
  b.style.left=bx+'px'; b.style.top=by+'px';
  b.style.setProperty('--tail',(bw/2-5)+'px');
  clearTimeout(b._h);                  // keep it pinned while egg is idle
}
setTimeout(eggBubble, 700);

eggEl.addEventListener('click',()=>{
  if(mode!=='egg') return;
  mode='hatching';
  hideBubble();
  eggEl.classList.remove('idle');
  eggEl.classList.add('hatching');
  // swap to the animated hatching gif (plays once, loop=1)
  // cache-bust so the gif restarts from frame 0 on click
  eggEl.style.backgroundImage='url("'+EGG_HATCH+'#'+Date.now()+'")';
  setTimeout(hatchDone, HATCH_MS);
});

function hatchDone(){
  eggEl.classList.add('gone');         // remove the shell
  // pet appears where the egg was, doing the legs-up tumble
  px = W()/2; py = Hh()/2;
  tx = px; ty = py;
  petEl.style.display='';
  mode='flop';
  flopUntil = performance.now()+FLOP_MS;
  setAnim(ROW.ATTACK,7);               // rear-up then flop: back legs up
}

/* persistent intro bubble, pinned just above Pip while he talks */
function introBubble(text){
  const b=document.getElementById('bubble');
  b.innerHTML=text;
  b.classList.add('show');
  positionBubble();                    // anchors above the pet at px,py
  clearTimeout(b._h);                  // stays until the next line / click
}
function startIntro(){
  introIdx=0;
  introBubble(INTRO_LINES[0]);
}
function advanceIntro(){
  introIdx++;
  if(introIdx>=INTRO_LINES.length){
    hideBubble();
    mode='wander'; pickTarget(); lastBubble=performance.now();
    return;
  }
  introBubble(INTRO_LINES[introIdx]);
}


/* ---------- notifications ---------- */
const NOTES=[];
function showBubble(tag,text,ms){
  const b=document.getElementById('bubble');
  b.innerHTML = (tag?'<span class="tag">'+tag+'</span>':'')+text;
  b.classList.add('show');
  positionBubble();
  clearTimeout(b._h);
  b._h=setTimeout(()=>{ b.classList.remove('show'); }, ms||4200);
}
function hideBubble(){ const b=document.getElementById('bubble'); b.classList.remove('show'); clearTimeout(b._h); }
function positionBubble(){
  const b=document.getElementById('bubble');
  const bw=b.offsetWidth||120, bh=b.offsetHeight||34;
  // center over the pet's head, sit just above it
  let bx=px-bw/2;
  let by=py-FW/2*0.62-bh-2;
  bx=Math.max(8,Math.min(W()-bw-8,bx));
  by=Math.max(8,by);
  b.style.left=bx+'px'; b.style.top=by+'px';
  const tailx=Math.max(8,Math.min(bw-16, px-bx-5));
  b.style.setProperty('--tail', tailx+'px');
}

/* ---------- main loop ---------- */
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  // animation frame stepping
  anim.t+=dt;
  const spf=1/anim.fps;
  if(anim.t>=spf){ anim.t-=spf; anim.frame=(anim.frame+1)%FRAMES[anim.row]; }
  pet.style.backgroundPosition = (-anim.frame*FW)+'px '+(-anim.row*FW)+'px';

  // behaviour
  if(mode==='egg' || mode==='hatching'){
    // pet is hidden inside the egg; keep the "hatch me!" bubble pinned while idle
    if(mode==='egg') eggBubble();
    requestAnimationFrame(loop);
    return;
  }
  else if(mode==='flop'){
    setAnim(ROW.ATTACK,7);             // rear-up then flop: back legs up
    if(now>=flopUntil){ mode='intro'; startIntro(); introLookT=now; introFacingT=now; }
  }
  else if(mode==='intro'){
    // Pip stays put in the centre and looks around while he talks
    px=W()/2; py=Hh()/2; tx=px; ty=py;
    // gently alternate idle poses so he reads as "looking around", not frozen
    setAnim(Math.floor(now/1100)%2 ? ROW.IDLE2 : ROW.IDLE, 5);
    // occasionally glance the other way
    if(now-introFacingT > 2600){ facing = -facing; introFacingT = now; }
    introBubble(INTRO_LINES[introIdx]); // keep the line pinned above him
  }
  else if(mode==='wander'){
    if(hunger<=0){
      // head to the bottom-right corner to sleep
      tx = W()-110; ty = Hh()-120;
      mode='gotosleep';
    } else {
      const dx=tx-px, dy=ty-py, d=Math.hypot(dx,dy);
      if(d>3){
        const sp=46*dt;
        px+=dx/d*sp; py+=dy/d*sp;
        facing = dx<0?-1:1;
        setAnim(ROW.WALK,8);
      } else {
        setAnim(idleTimer%2?ROW.IDLE2:ROW.IDLE,5);
        if(now>repickAt) { pickTarget(); idleTimer++; }
      }
      // ambient hunger drain
      hunger=Math.max(0,hunger-dt*0.45);
    }
  }
  else if(mode==='gotosleep'){
    const dx=tx-px, dy=ty-py, d=Math.hypot(dx,dy);
    if(d>6){
      const step=Math.min(120*dt, d);   // tired shuffle to the corner
      px+=dx/d*step; py+=dy/d*step;
      facing=dx<0?-1:1; setAnim(ROW.WALK,5);
    } else {
      px=tx; py=ty;
      mode='sleeping'; lastBubble=0;
    }
  }
  else if(mode==='summon'){
    const dx=tx-px, dy=ty-py, d=Math.hypot(dx,dy);
    if(d>6){
      const step=Math.min(600*dt, d);   // never overshoot the target
      px+=dx/d*step; py+=dy/d*step;
      facing=dx<0?-1:1; setAnim(ROW.WALK,16);
    } else {
      px=tx; py=ty;                       // snap, then dock
      mode='docked'; openChat();
    }
  }
  else if(mode==='docked'){ setAnim(ROW.IDLE,5); }
  else if(mode==='sleeping'){ setAnim(ROW.SLEEP,5);
    if(now-lastBubble>6000){ showBubble('','💤 zzz… tap me to feed',5000); lastBubble=now; }
  }

  pet.style.left=(px-FW/2)+'px';
  pet.style.top =(py-FW/2)+'px';
  pet.classList.toggle('flip', facing<0);
  if(document.getElementById('bubble').classList.contains('show')) positionBubble();
  syncHunger();
  updateStatus();
  requestAnimationFrame(loop);
}
function updateStatus(){
  const s=document.getElementById('petStatus'); if(!s) return;
  let txt='awake', col='var(--green)';
  if(mode==='sleeping'||mode==='gotosleep'){ txt='sleepy'; col='#9a8bd0'; }
  else if(hunger<25){ txt='hungry'; col='#ffb24d'; }
  s.innerHTML='<i style="background:'+col+';box-shadow:0 0 8px '+col+'"></i> '+txt;
  s.style.color=col;
}
requestAnimationFrame(loop);

/* ---------- click pet -> run to tray & open chat ---------- */
pet.addEventListener('click',()=>{
  if(mode==='egg'||mode==='hatching'||mode==='flop') return;  // let the hatch finish
  if(mode==='intro'){ advanceIntro(); return; }               // tap to advance Pip's intro
  if(mode==='sleeping'){
    // already in the corner — open chat straight to the Food tab to feed it
    mode='docked';
    openChat();
    switchView('food','food');
    const b=document.getElementById('bubble'); b.classList.remove('show'); clearTimeout(b._h);
    return;
  }
  if(mode==='gotosleep'){
    // intercept on the way to bed: dock here and open food
    px=tx; py=ty; mode='docked';
    openChat(); switchView('food','food');
    return;
  }
  if(mode==='docked'){ openChat(); return; }
  // dock target: just above clock / bottom-right
  tx = W()-150; ty = Hh()-150;
  mode='summon';
  const b=document.getElementById('bubble'); b.classList.remove('show'); clearTimeout(b._h);
});

/* ---------- chat window ---------- */
const chat=document.getElementById('chat');
function openChat(){
  chat.classList.add('open');
  requestAnimationFrame(()=>chat.classList.add('shown'));
  renderConvs(); renderActive();
  switchView('chat');
}

  chat.classList.remove('shown');

/* ---------- color theme ---------- */
let theme={1:'#1a1622',2:'#ff8a3c'};
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(hex, withRgb, t){ // t=0 -> hex, t=1 -> withRgb
  const a=hexToRgb(hex);
  const r=Math.round(a[0]+(withRgb[0]-a[0])*t);
  const g=Math.round(a[1]+(withRgb[1]-a[1])*t);
  const b=Math.round(a[2]+(withRgb[2]-a[2])*t);
  return 'rgb('+r+','+g+','+b+')';
}
function lum(rgb){return (0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2])/255;}
function applyTheme(tint){
  const A=theme[1], B=theme[2];
  const root=document.documentElement.style;
  root.setProperty('--accent',A);
  root.setProperty('--accent2',B);
  if(tint){
    // pick a hue source for the chrome: use the accent, but if it's near-white
    // fall back to the highlight so the window still gets color instead of washing out
    let src=A, srgb=hexToRgb(A);
    if(lum(srgb)>0.8){ src=B; srgb=hexToRgb(B); if(lum(srgb)>0.8){ src='#6c6f86'; srgb=hexToRgb('#6c6f86'); } }
    // tint toward a soft dark slate (lighter than before) so the UI reads as colored
    const dPanel=[26,22,34], dCard=[34,28,46], dSb=[20,16,28], dLine=[64,56,86];
    root.setProperty('--panel',  mix(src,dPanel, 0.78));
    root.setProperty('--panel2', mix(src,dCard,  0.62));
    root.setProperty('--sb',     mix(src,dSb,    0.84));
    root.setProperty('--line',   mix(src,dLine,  0.42));
  }
  const s1=document.getElementById('sw1'); if(s1) s1.style.background=A;
  const s2=document.getElementById('sw2'); if(s2) s2.style.background=B;
  // readable text on accent-colored buttons
  root.setProperty('--onA', lum(hexToRgb(A))>0.55 ? '#1a1208' : '#fdf6ec');
  root.setProperty('--onB', lum(hexToRgb(B))>0.55 ? '#1a1208' : '#fdf6ec');
}
applyTheme(true);

/* ---------- window resizing ---------- */
(function(){
  const chatEl=document.getElementById('chat');
  const h=document.getElementById('resizeH');
  if(!h) return;
  const SCALE=0.75;
  let rs=false,sx,sy,sw,sh;
  const down=e=>{
    rs=true; const p=e.touches?e.touches[0]:e;
    sx=p.clientX; sy=p.clientY;
    sw=parseFloat(getComputedStyle(chatEl).width);
    sh=parseFloat(getComputedStyle(chatEl).height);
    e.preventDefault(); e.stopPropagation();
  };
  const move=e=>{
    if(!rs) return; const p=e.touches?e.touches[0]:e;
    // dragging up-left grows; divide by scale since the box is transform-scaled
    let nw=sw+(sx-p.clientX)/SCALE;
    let nh=sh+(sy-p.clientY)/SCALE;
    nw=Math.max(360,Math.min(760,nw));
    nh=Math.max(360,Math.min(760,nh));
    chatEl.style.width=nw+'px'; chatEl.style.height=nh+'px';
    e.preventDefault();
  };
  const up=()=>{rs=false;};
  h.addEventListener('mousedown',down); h.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
})();

  let EXCLUDE=(localStorage.getItem('p3ts.exclude')||'bank\n1password\nkeychain\npassword').split('\n').map(x=>x.trim().toLowerCase()).filter(Boolean);
  let PROVIDER=localStorage.getItem('p3ts.provider')||'claudecli';         // 'claudecli' | 'claude' | 'openclaw'
  let OCURL=localStorage.getItem('p3ts.ocurl')||'http://localhost:18789';  // OpenClaw gateway base URL
  let OCKEY=localStorage.getItem('p3ts.ockey')||'';                        // optional OpenClaw token
  const SYS=()=>"You are "+PETNAME+", a small warm pixel desktop pet living on the user's screen. Keep replies short, friendly and casual, no markdown. You only see the screen when the user enables watching.";
  const hasNative=!!(window.pip&&window.pip.claude);
  const isPreview=!!(window.pip&&window.pip.__preview);
  // resolve the active connection into {provider,key,baseUrl,model}
  function conn(){
    if(PROVIDER==='claudecli') return {provider:'claudecli', key:'', baseUrl:'', model:''};
    if(PROVIDER==='openclaw')  return {provider:'openclaw', key:OCKEY||'', baseUrl:OCURL, model:'openclaw/default'};
    return {provider:'claude', key:API_KEY, baseUrl:'https://api.anthropic.com', model:MODEL};
  }
  function connected(){ if(PROVIDER==='claudecli') return true; return PROVIDER==='openclaw' ? !!OCURL : !!API_KEY; }
  function visionOK(){ return PROVIDER!=='claudecli'; }   // CLI path is text-only

  /* ---------- desktop name sync ---------- */
  function syncName(){ document.querySelectorAll('.pane .top .nm').forEach(n=>n.textContent=PETNAME);
    const inp=$('inp'); if(inp) inp.placeholder='Message '+PETNAME+'… (Enter to send)'; }

  /* ---------- live chat: real screen commentary ---------- */
  (function seedLive(){ const lc=convs.find(c=>c.live); if(!lc) return;
    lc.sub='ready to chat'; lc.msgs=[{who:'bot',t:"hey! i'm "+PETNAME+". just chat with me — i use your own Claude Code login, no setup needed. the 👁 up top turns on screen-watching (that one needs an Anthropic API key). everything stays on this machine."}]; })();
  function pushLive(text){ const lc=convs.find(c=>c.live); if(!lc) return;
    lc.msgs.push({who:'bot',t:text}); lc.sub=text.length>34?text.slice(0,33)+'…':text;
    if(typeof activeId!=='undefined'&&activeId===lc.id) renderActive();
    if($('chat').classList.contains('open')) renderConvs(); }

  /* ---------- Claude-wired chat ---------- */
  function addTyping(){ const m=$('msgs'); if(!m) return null; const e=document.createElement('div');
    e.className='msg bot typing'; e.innerHTML='<span></span><span></span><span></span>'; m.appendChild(e); m.scrollTop=m.scrollHeight; return e; }
  function collapse(a){ const o=[]; for(const m of a){ if(o.length&&o[o.length-1].role===m.role) o[o.length-1].content+='\n'+m.content; else o.push({role:m.role,content:m.content}); } return o; }
  async function askClaude(c){
    if(!hasNative) return "(browser preview — i can't reach an AI here. open me in the desktop app and i'll reply for real 🐾)";
    if(!connected() && !isPreview) return "open settings (the ⚙ in the chat, or right-click me) and connect to claude or openclaw first 🐾";
    let msgs=c.msgs.filter(m=>m.who==='me'||m.who==='bot').map(m=>({role:m.who==='me'?'user':'assistant',content:m.t}));
    while(msgs.length&&msgs[0].role!=='user') msgs.shift();
    msgs=collapse(msgs);
    const cn=conn();
    try{ return await window.pip.claude({provider:cn.provider,key:cn.key,baseUrl:cn.baseUrl,model:cn.model,max_tokens:300,system:SYS(),messages:msgs}); }
    catch(e){ return "(couldn't reach "+(PROVIDER==='openclaw'?'openclaw':'claude')+" — "+e.message+")"; }
  }
  window.send=async function(){
    const i=$('inp'); const v=i.value.trim(); if(!v) return;
    const c=convs.find(x=>x.id===activeId); if(!c) return;
    c.msgs.push({who:'me',t:v}); if(activeId===c.id) addMsgEl('me',v); i.value=''; c.sub=v.slice(0,28); renderConvs();
    const typing=(activeId===c.id)?addTyping():null;
    let r; try{ r=await askClaude(c); }catch(e){ r="(error: "+e.message+")"; }
    if(typing&&typing.remove) typing.remove();
    c.msgs.push({who:'bot',t:r}); if(activeId===c.id) addMsgEl('bot',r); c.sub=r.slice(0,28); renderConvs();
  };

  /* ---------- intro → "let's get started" → minimal Claude Code connect → chat ---------- */
  window.advanceIntro=function(){
    introIdx++;
    if(introIdx>=INTRO_LINES.length){ hideBubble(); mode='wander'; pickTarget(); lastBubble=performance.now();
      setTimeout(openConnect, 400); return; }
    introBubble(INTRO_LINES[introIdx]);
  };

  /* ---------- screen watching (real capture + Claude vision) ---------- */
  let stream=null,loop=null,busy=false,paused=false,watching=false;
  async function startWatch(){
    if(!hasNative){ pushLive("screen watching needs the desktop app 🐾"); return; }
    if(!visionOK()){ openSettings(); pushLive("screen-watch needs the API or OpenClaw provider — your Claude Code subscription does chat only 🐾"); return; }
    if(!connected()){ openSettings(); pushLive("connect to claude or openclaw first, then i can watch 👀"); return; }
    let id; try{ const src=await window.pip.listSources(); if(!src.length){ pushLive("no screen found to watch."); return; } id=src[0].id; }
    catch(e){ pushLive("capture unavailable: "+e.message); return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:false,
      video:{mandatory:{chromeMediaSource:'desktop',chromeMediaSourceId:id,maxWidth:1600,maxHeight:1000}}}); }
    catch(e){ pushLive("couldn't start capture: "+e.message); return; }
    const vid=$('vid'); vid.srcObject=stream; await vid.play();
    paused=false; watching=true; updateWatchUI();
    pushLive("watching your screen now 👀 everything stays on this machine.");
    commentTick(); loop=setInterval(commentTick,INTERVAL);
  }
  function stopWatch(){ if(loop)clearInterval(loop); if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=null;loop=null;watching=false;paused=false;updateWatchUI(); pushLive("stopped watching."); }
  async function commentTick(){
    if(busy||!stream||paused) return; busy=true;
    try{ const vid=$('vid'),cap=$('cap'); const w=vid.videoWidth||1600,h=vid.videoHeight||1000,sc=Math.min(1,900/w);
      cap.width=Math.round(w*sc); cap.height=Math.round(h*sc);
      cap.getContext('2d').drawImage(vid,0,0,cap.width,cap.height);
      const b64=cap.toDataURL('image/jpeg',0.6).split(',')[1];
      const cn=conn();
      const txt=await window.pip.claude({provider:cn.provider,key:cn.key,baseUrl:cn.baseUrl,model:cn.model,max_tokens:120,system:SYS(),
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
          {type:'text',text:'React in ONE short warm sentence to what is on screen. If you see anything sensitive (banking, passwords, financial info)'+(EXCLUDE.length?(' or anything matching: '+EXCLUDE.join(', ')):'')+', reply exactly "(looking away)".'}]}]});
      if(!/looking away/i.test(txt)){ pushLive(txt);
        if(!$('chat').classList.contains('open')) showBubble('Live',txt.length>60?txt.slice(0,58)+'…':txt,4200); }
    }catch(e){ /* skip a frame */ }
    finally{ busy=false; }
  }

  /* ---------- settings panel ---------- */
  const SETTINGS=''
    +'<div id="settings"><div class="set-card">'
    +'<button class="set-x" id="sX">✕</button>'
    +'<h3>⚙ <span id="sTitle">Pip</span> — settings</h3>'
    +'<label>Pet name</label><input id="sName" maxlength="20" placeholder="Pip"/>'
    +'<label>Connect with</label><select id="sProvider">'
    +'<option value="claudecli">Claude Code — your subscription (no API key)</option>'
    +'<option value="claude">Claude — Anthropic API key</option>'
    +'<option value="openclaw">OpenClaw — local gateway</option></select>'
    +'<div id="rowCLI" style="display:none"><div class="set-hint">Uses your own <b>Claude Code</b> login — no API key, no API bill. One-time setup: install Claude Code, then run <code>claude</code> once to sign in. <b>Chat only</b> — the 👁 screen-watching feature needs an Anthropic API key (switch to “Claude — API key” above).</div></div>'
    +'<div id="rowClaude"><label>Anthropic API key</label><input id="sKey" type="password" placeholder="sk-ant-…" autocomplete="off"/></div>'
    +'<div id="rowOC" style="display:none"><label>OpenClaw endpoint</label>'
    +'<input id="sOcurl" placeholder="http://localhost:18789" autocomplete="off"/>'
    +'<label>OpenClaw token (optional)</label><input id="sOckey" type="password" placeholder="optional" autocomplete="off"/></div>'
    +'<label>Model</label><select id="sModel">'
    +'<option value="claude-haiku-4-5-20251001">Haiku — fast</option>'
    +'<option value="claude-sonnet-4-6">Sonnet — balanced</option>'
    +'<option value="claude-opus-4-8">Opus — best</option></select>'
    +'<label>Comment every</label><select id="sInt">'
    +'<option value="10000">10 seconds</option><option value="15000">15 seconds</option>'
    +'<option value="30000">30 seconds</option><option value="60000">1 minute</option></select>'
    +'<div class="set-row"><button class="set-btn" id="sWatch">👁 Watch my screen</button>'
    +'<button class="set-btn" id="sPause" title="Pause" style="flex:0 0 46px">⏸</button></div>'
    +'<label>Privacy — never watch these</label>'
    +'<textarea id="sExcl" placeholder="one per line: bank, 1password, keychain…"></textarea>'
    +'<div class="set-hint">When the screen shows anything sensitive (banking, passwords) or matching these, '+'Pip looks away and sends nothing. Your key &amp; data stay on this machine.</div>'
    +'<label>Wallet — buy cosmetics with crypto</label>'
    +'<input id="sWcpid" placeholder="WalletConnect Project ID" autocomplete="off"/>'
    +'<input id="sEthRecv" placeholder="Your ETH receiving address (0x…)" autocomplete="off" style="margin-top:6px"/>'
    +'<input id="sSolRecv" placeholder="Your SOL receiving address" autocomplete="off" style="margin-top:6px"/>'
    +'<div class="set-hint">Players connect Phantom/MetaMask via WalletConnect and pay <b>these addresses</b> for cosmetics. Get a free Project ID at cloud.reown.com.</div>'
    +'<div class="set-row"><button class="set-btn" id="sNotify">🔔 Test</button>'
    +'<button class="set-btn primary" id="sSave">Save</button></div>'
    +'</div></div>';
  document.body.insertAdjacentHTML('beforeend',SETTINGS);
  // minimal start-of-app connect step — Claude Code only
  document.body.insertAdjacentHTML('beforeend',
    '<div id="connectc"><div class="set-card" style="text-align:center;width:300px">'
    +'<h3 style="justify-content:center">🐾 Meet <span id="ccName">Pip</span></h3>'
    +'<div class="set-hint">I chat using <b>your own Claude Code</b> login — no API key, no setup.</div>'
    +'<div class="set-hint" style="margin-top:8px">First time? Install Claude Code on this computer and run <code>claude</code> once to sign in.</div>'
    +'<button class="set-btn primary" id="ccGo" style="margin-top:12px">Start chatting →</button>'
    +'<div class="set-hint" style="margin-top:10px;opacity:.65">API key, model &amp; privacy options live in the ⚙ in the chat.</div>'
    +'</div></div>');
  function openConnect(){ const n=$('ccName'); if(n) n.textContent=PETNAME; $('connectc').classList.add('show'); setIgnore(false); }
  function closeConnect(){ $('connectc').classList.remove('show'); }
  function connectGo(){ closeConnect(); if(!$('chat').classList.contains('open')) openChat(); }
  $('ccGo').onclick=connectGo;
  $('connectc').addEventListener('click',e=>{ if(e.target.id==='connectc') connectGo(); });
  function updateWatchUI(){
    const w=$('sWatch');
    if(w){
      if(!visionOK()){ w.textContent='👁 Watch — needs API key'; w.classList.remove('on'); }
      else { w.textContent=watching?(paused?'⏸ Paused — click to watch':'👁 Watching — click to stop'):'👁 Watch my screen'; w.classList.toggle('on',watching&&!paused); }
    }
    const ew=$('openWatch'); if(ew){ ew.style.color = watching?(paused?'#ffd23f':'var(--green)'):'';
      ew.title = visionOK() ? (watching?'Screen watching — click to stop':'Screen watching') : 'Screen watching (needs an Anthropic API key)'; }
  }
  function applyProviderUI(){ const p=$('sProvider').value;
    $('rowCLI').style.display=p==='claudecli'?'':'none';
    $('rowClaude').style.display=p==='claude'?'':'none';
    $('rowOC').style.display=p==='openclaw'?'':'none'; }
  function openSettings(){ $('sName').value=PETNAME; $('sKey').value=API_KEY; $('sModel').value=MODEL;
    $('sProvider').value=PROVIDER; $('sOcurl').value=OCURL; $('sOckey').value=OCKEY; applyProviderUI();
    $('sInt').value=String(INTERVAL); $('sExcl').value=localStorage.getItem('p3ts.exclude')||'bank\n1password\nkeychain\npassword';
    $('sWcpid').value=localStorage.getItem('p3ts.wcpid')||''; $('sEthRecv').value=localStorage.getItem('p3ts.ethrecv')||''; $('sSolRecv').value=localStorage.getItem('p3ts.solrecv')||'';
    $('sTitle').textContent=PETNAME; updateWatchUI(); $('settings').classList.add('show'); setIgnore(false); }
  function closeSettings(){ $('settings').classList.remove('show'); }
  $('sProvider').onchange=applyProviderUI;
  $('sX').onclick=closeSettings;
  $('settings').addEventListener('click',e=>{ if(e.target.id==='settings') closeSettings(); });
  $('sSave').onclick=()=>{ PETNAME=$('sName').value.trim()||'Pip'; localStorage.setItem('p3ts.name',PETNAME);
    API_KEY=$('sKey').value.trim(); localStorage.setItem('p3ts.key',API_KEY);
    PROVIDER=$('sProvider').value; localStorage.setItem('p3ts.provider',PROVIDER);
    OCURL=$('sOcurl').value.trim()||'http://localhost:18789'; localStorage.setItem('p3ts.ocurl',OCURL);
    OCKEY=$('sOckey').value.trim(); localStorage.setItem('p3ts.ockey',OCKEY);
    MODEL=$('sModel').value; localStorage.setItem('p3ts.model',MODEL);
    INTERVAL=+$('sInt').value; localStorage.setItem('p3ts.interval',INTERVAL);
    const raw=$('sExcl').value; localStorage.setItem('p3ts.exclude',raw);
    EXCLUDE=raw.split('\n').map(x=>x.trim().toLowerCase()).filter(Boolean);
    localStorage.setItem('p3ts.wcpid', $('sWcpid').value.trim());
    localStorage.setItem('p3ts.ethrecv', $('sEthRecv').value.trim());
    localStorage.setItem('p3ts.solrecv', $('sSolRecv').value.trim());
    if(stream&&loop){ clearInterval(loop); loop=setInterval(commentTick,INTERVAL); }
    syncName(); $('sTitle').textContent=PETNAME;
    showBubble('', 'saved 🐾', 1800);
    closeSettings();
  };
  $('sWatch').onclick=()=> watching?stopWatch():startWatch();
  $('sPause').onclick=()=>{ if(!stream) return; paused=!paused; updateWatchUI();
    showBubble('', paused?'looking away 🙈':'watching again 👀', 1800); };
  $('sNotify').onclick=()=>{ if(hasNative&&window.pip.notify) window.pip.notify(PETNAME, PETNAME+' says hi 🐾');
    else showBubble('', 'notifications need the desktop app', 2000); };

  /* ---------- header buttons next to the ✕: 👁 screen-watch (opt-in) + ⚙ settings ---------- */
  function toggleWatchFromHeader(){
    if(!visionOK()){ showBubble('', 'screen-watching needs an Anthropic API key — pick “Claude — API key” in settings 🐾', 3600); openSettings(); return; }
    if(!connected()){ openSettings(); return; }
    watching ? stopWatch() : startWatch();
  }
  (function addHeaderBtns(){ const top=document.querySelector('.pane .top'); if(!top) return;
    const x=top.querySelector('.wc-x');
    const eye=document.createElement('button'); eye.className='wc-x'; eye.id='openWatch';
    eye.title='Screen watching (needs API key)'; eye.textContent='👁'; eye.style.fontSize='14px'; eye.style.marginLeft='auto';
    eye.onclick=toggleWatchFromHeader;
    const g=document.createElement('button'); g.className='wc-x'; g.id='openSet'; g.title='Settings';
    g.textContent='⚙'; g.style.fontSize='15px'; g.style.marginLeft='6px'; g.onclick=openSettings;
    if(x){ x.style.marginLeft='6px'; top.insertBefore(eye,x); top.insertBefore(g,x); } else { top.appendChild(eye); top.appendChild(g); }
  })();
  window.openSettings=openSettings;   // let other handlers reach it

  /* ---------- "Find" opens the cove scene game (transplanted from widget2) ---------- */
  window.findItem=function(cat){ if(window.__openSceneGame) window.__openSceneGame(); };

  /* ---------- native bridge: right-click menu + settings event ---------- */
  if(hasNative){
    ['pet','egg'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('contextmenu',e=>{ e.preventDefault(); window.pip.petMenu&&window.pip.petMenu(); }); });
    window.pip.onOpenSettings&&window.pip.onOpenSettings(()=>openSettings());
  }

  /* ---------- click-through: window is mouse-transparent except over the pet/chat/settings ---------- */
  function setIgnore(v){ if(window.pip&&window.pip.setIgnore) window.pip.setIgnore(v); }
  let ignoring=null;
  function over(x,y){ const el=document.elementFromPoint(x,y); return !!(el&&el.closest('#pet,#egg,#chat,#settings')); }
  function refresh(x,y){ const want=!over(x,y); if(want!==ignoring){ ignoring=want; setIgnore(want); } }
  window.addEventListener('mousemove',e=>refresh(e.clientX,e.clientY));
  // start mouse-transparent so the real desktop is clickable
  setIgnore(true); ignoring=true;

  syncName();
})();
</script>

    if(x<20||x>NW-20||y<58||y>NH-18) return false;   // map bounds only

  function moveCollide(x,y,vx,vy){

    const wrap=document.getElementById('gmcats'); wrap.innerHTML='';
    for(const c of CATS){
      const b=document.createElement('button'); b.className='gmcat'+(mktCat===c?' on':'');
      b.textContent=c; b.onclick=()=>{ mktCat=c; buildCats(); renderMarket(); };
      wrap.appendChild(b);
    }
  }
  function openMarket(name){
    mktName=name||'Marketplace'; mktCat='All'; mktQuery='';
    document.getElementById('gmtitle').textContent=mktName;
    document.getElementById('gmsearch').value='';
    setTab('buy'); buildCats();
    document.getElementById('gmarket').classList.add('show');
    updateCoins();
  }
  function closeMarket(){ document.getElementById('gmarket').classList.remove('show'); }
  function matchFilter(s){
    if(mktCat!=='All' && s.cat!==mktCat) return false;
    if(mktQuery && !s.name.toLowerCase().includes(mktQuery)) return false;
    return true;
  }
  function clampPrice(v){ return Math.max(1,Math.min(99,Math.round(v||1))); }
  function renderMarket(){
    const list=document.getElementById('gmlist'); list.innerHTML='';
    // group by category section
    const items=SHOP.filter(s=>{
      if(!matchFilter(s)) return false;
      if(mktTab==='sell'){ const f=foodByName(s.name); if(!f||f.n<=0) return false; }
      return true;
    });
    if(!items.length){
      list.innerHTML='<div class="gmempty">'+(mktTab==='sell'
        ? 'Nothing here to sell — gather or filter differently.'
        : 'No items match your search.')+'</div>';
      return;
    }
    const order=['Produce','Seafood','Forage'];
    for(const cat of order){
      const group=items.filter(s=>s.cat===cat); if(!group.length) continue;
      const h=document.createElement('div'); h.className='gmsec'; h.textContent=cat;
      list.appendChild(h);
      for(const s of group){
        const f=foodByName(s.name);
        const row=document.createElement('div'); row.className='gmrow';
        if(mktTab==='buy'){
          row.innerHTML='<img src="data:image/png;base64,'+(f?f.ic:'')+'"/>'+
            '<span class="gmn">'+s.name+'<small>🪙 '+s.buy+' each</small></span>'+
            '<button class="gmbtn"'+(coins<s.buy?' disabled':'')+'>Buy</button>';
          row.querySelector('button').onclick=()=>{
            if(coins<s.buy) return; coins-=s.buy; if(f) f.n++;
            if(typeof renderCat==='function') renderCat(); updateCoins(); renderMarket();
          };
        } else {
          // listing price selector
          if(sellPrice[s.name]==null) sellPrice[s.name]=s.sell;
          const p=clampPrice(sellPrice[s.name]);
          row.innerHTML='<img src="data:image/png;base64,'+f.ic+'"/>'+
            '<span class="gmn">'+s.name+'<small>You hold x'+f.n+'</small></span>'+
            '<span class="gmprice"><button class="dn">−</button>'+
              '<input type="text" inputmode="numeric" value="'+p+'"/>'+
              '<button class="up">+</button></span>'+
            '<button class="gmbtn sell">List</button>';
          const inp=row.querySelector('.gmprice input');
          const sync=v=>{ sellPrice[s.name]=clampPrice(v); inp.value=sellPrice[s.name]; };
          row.querySelector('.dn').onclick=()=>sync(clampPrice(sellPrice[s.name])-1);
          row.querySelector('.up').onclick=()=>sync(clampPrice(sellPrice[s.name])+1);
          inp.onchange=()=>sync(parseInt(inp.value,10));
          row.querySelector('.gmbtn').onclick=()=>{
            if(f.n<=0) return; const price=clampPrice(sellPrice[s.name]);
            f.n--; coins+=price;
            logMsg('','📦 Listed 1 '+s.name+' for 🪙 '+price+' — sold!','sys');
            if(typeof renderCat==='function') renderCat(); updateCoins(); renderMarket();
          };
        }
        list.appendChild(row);
      }
    }
  }
  document.getElementById('gmclose').onclick=closeMarket;
  document.getElementById('gmtab-buy').onclick=()=>setTab('buy');
  document.getElementById('gmtab-sell').onclick=()=>setTab('sell');
  document.getElementById('gmsearch').addEventListener('input',e=>{
    mktQuery=e.target.value.trim().toLowerCase(); renderMarket();
  });
  document.getElementById('gmsearch').addEventListener('keydown',e=>e.stopPropagation());

  // ---- foods ----
  function foodByName(n){ return FOODS.find(f=>f.name===n); }

  // ---- other players ----
  const NAMES=['Mochi','BambooKing','river_fox','Pebble','sunny','Tuk','Clementine','no_oat'];
  const others=[];
  function spawnOthers(){
    if(typeof net!=='undefined' && net.online) return;
    others.length=0;
    const n=0;  /* no bots — real players only */
    for(let i=0;i<n;i++){
      const el=document.createElement('div'); el.className='gother';
      const lbl=document.createElement('div'); lbl.className='gname';
      const name=NAMES[Math.floor(Math.random()*NAMES.length)];
      lbl.textContent=name;
      el.style.setProperty('--hue',(60+Math.random()*260)+'deg');
      stage.appendChild(el); stage.appendChild(lbl);
      let sx,sy,t=0; do{ sx=80+Math.random()*480; sy=120+Math.random()*340; t++; }while(!walkable(sx,sy)&&t<20);
      const o={el,lbl,name,x:sx,y:sy,tx:sx,ty:sy,face:1,
        nextChat:performance.now()+4000+Math.random()*9000,frame:0,ft:0};
      pickOther(o); others.push(o);
    }
    updateOnline();
  }
  function pickOther(o){
    let nx,ny,tries=0;
    do{ nx=80+Math.random()*480; ny=120+Math.random()*360; tries++; }
    while(!walkable(nx,ny)&&tries<16);
    o.tx=nx; o.ty=ny;
  }
  function updateOnline(){ gct.textContent=(others.length+1)+' online'; }
  const OTHER_LINES=['anyone got spare bamboo?','this beach is so calm today','look at my hat 😎',
    'caught 3 fish!','the pumpkins are huge rn','brb feeding my panda','gm 🌅','race you to the dock',
    'who keeps taking my berries','lovely evening for a stroll'];

  // ---- chat ----
  function logMsg(author,text,cls){
    const d=document.createElement('div'); d.className='gmsg'+(cls?(' '+cls):'');
    if(cls==='sys'){ d.textContent=text; }
    else { d.innerHTML='<span class="au">'+esc(author)+':</span> '+esc(text); }
    glog.appendChild(d);
    while(glog.children.length>60) glog.removeChild(glog.firstChild);
    glog.scrollTop=glog.scrollHeight;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function sendChat(){
    const v=gcin.value.trim(); if(!v) return; gcin.value='';
    logMsg('You',v,'me');
    bubblePet(v);
    if(typeof net!=='undefined' && net.online){ netSendChat(v); }
    else if(others.length && Math.random()<0.55){
      const o=others[Math.floor(Math.random()*others.length)];
      setTimeout(()=>{ const r=REPLIES[Math.floor(Math.random()*REPLIES.length)];
        logMsg(o.name, r); bubbleOther(o, r); }, 900+Math.random()*1400);
    }
  }
  const REPLIES=['haha nice','oh same','👀','where you at?','agreed','lol','🐼','+1','show me!','gg'];
  document.getElementById('gcsend').onclick=sendChat;
  gcin.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();sendChat();} e.stopPropagation(); });

  // ---- speech bubbles (translucent, 3s) ----
  let petBubble=null, petBubbleT=0;
  function bubblePet(text){
    if(petBubble) petBubble.remove();
    petBubble=document.createElement('div'); petBubble.className='gbub';
    petBubble.textContent=text; stage.appendChild(petBubble);
    clearTimeout(petBubbleT);
    petBubbleT=setTimeout(()=>{ if(petBubble){petBubble.remove();petBubble=null;} },3000);
  }
  function bubbleOther(o,text){
    if(o.bub) o.bub.remove();
    o.bub=document.createElement('div'); o.bub.className='gbub';
    o.bub.textContent=text; stage.appendChild(o.bub);
    clearTimeout(o.bubT);
    o.bubT=setTimeout(()=>{ if(o.bub){o.bub.remove();o.bub=null;} },3000);
  }

  // ---- auto gather: one resource every 30s while idle in a zone ----
  let gathering=false, gatherP=0;
  const GATHER_SECS=30;
  function popText(txt,x,y){
    const p=document.createElement('div'); p.className='gpop'; p.textContent=txt;
    p.style.left=x+'px'; p.style.top=y+'px';
    stage.appendChild(p); setTimeout(()=>p.remove(),1150);
  }
  function tickGather(dt){
    const z=zoneAt(gx,gy);
    const moving=Math.hypot(gtx-gx,gty-gy)>3 || keyVec().m>0;
    if(z && !moving){
      if(!gathering){ gathering=true; gatherP=0; gprog.classList.add('show'); }
      gatherP+=dt/GATHER_SECS;                 // 30s per item
      gprogBar.style.width=Math.min(100,gatherP*100)+'%';
      gset(gatherP>0.92?ROW.ATTACK:ROW.IDLE, gatherP>0.92?7:5);
      if(gatherP>=1){
        const name=z.yield[Math.floor(Math.random()*z.yield.length)];
        const f=foodByName(name); if(f) f.n++;
        popText('+1 '+name, gx, gy-PETF*0.5);
        if(typeof renderCat==='function') renderCat();
        gatherP=0;
      }
    } else if(gathering){
      gathering=false; gprog.classList.remove('show'); gprogBar.style.width='0%';
    }
  }
  function updateZoneHud(){
    const z=zoneAt(gx,gy);
    if(z){ zname.textContent=z.name; zdot.style.color=z.color; }
    else { zname.textContent='Cove'; zdot.style.color='#9fb0c8'; }
  }

  // ---- screen <-> native ----
  function screenToNative(clientX,clientY){
    const r=world.getBoundingClientRect();
    const nx=camx + (clientX-r.left - r.width/2)/zoom;
    const ny=camy + (clientY-r.top  - r.height/2)/zoom;
    return [nx,ny];
  }
  // right-click to move
  world.addEventListener('contextmenu',e=>{
    e.preventDefault();
    let [mx,my]=screenToNative(e.clientX,e.clientY);
    mx=Math.max(28,Math.min(NW-28,mx)); my=Math.max(64,Math.min(NH-8,my));
    gtx=mx; gty=my; usingKeys=false;
    gring.style.left=mx+'px'; gring.style.top=my+'px';
    gring.classList.remove('ping'); void gring.offsetWidth; gring.classList.add('ping');
  });

  // ---- WASD ----
  const keys={};
  function keyVec(){
    let vx=0,vy=0;
    if(keys['w']||keys['arrowup'])   vy-=1;
    if(keys['s']||keys['arrowdown']) vy+=1;
    if(keys['a']||keys['arrowleft']) vx-=1;
    if(keys['d']||keys['arrowright'])vx+=1;
    const m=Math.hypot(vx,vy);
    return {vx,vy,m};
  }
  window.addEventListener('keydown',e=>{
    if(!open) return;
    const ae=document.activeElement;
    if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')) return;   // typing
    if(document.getElementById('gmarket').classList.contains('show')) return; // market open
    const k=e.key.toLowerCase();
    if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
      keys[k]=true; usingKeys=true; e.preventDefault();
    }
  });
  window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

  // ---- zoom ----
  function setZoom(z){ zoom=Math.max(ZMIN,Math.min(ZMAX,z)); }
  document.getElementById('gzin').onclick =()=>setZoom(zoom*1.25);
  document.getElementById('gzout').onclick=()=>setZoom(zoom/1.25);
  world.addEventListener('wheel',e=>{ e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.12:1/1.12)); },{passive:false});

  // ---- loop ----
  function gloop(now){
    if(!open) return;
    const dt=Math.min(.05,(now-lastT)/1000)||0; lastT=now;

    // movement: WASD takes priority, else walk toward click target
    const kv=keyVec();
    if(kv.m>0){
      const sp=95*dt;
      const [nx,ny]=moveCollide(gx,gy, kv.vx/kv.m*sp, kv.vy/kv.m*sp);
      gx=nx; gy=ny; gtx=gx; gty=gy;
      if(kv.vx!==0) gface=kv.vx<0?-1:1;
      gset(ROW.WALK,9);
    } else {
      const dx=gtx-gx, dy=gty-gy, d=Math.hypot(dx,dy);
      if(d>3){
        const sp=Math.min(90*dt,d);
        const [nx,ny]=moveCollide(gx,gy, dx/d*sp, dy/d*sp);
        if(nx===gx && ny===gy){ gtx=gx; gty=gy; }
        gx=nx; gy=ny; gface=dx<0?-1:1; gset(ROW.WALK,9);
      } else if(!gathering){
        gset(ROW.IDLE,5);
      }
    }

    tickGather(dt);

    // camera follows pet, clamped
    const vw=world.clientWidth, vh=world.clientHeight;
    const halfW=vw/2/zoom, halfH=vh/2/zoom;
    camx += (gx-camx)*Math.min(1,dt*7);
    camy += (gy-camy)*Math.min(1,dt*7);
    camx=Math.max(Math.min(halfW,NW/2),Math.min(camx, NW-Math.min(halfW,NW/2)));
    camy=Math.max(Math.min(halfH,NH/2),Math.min(camy, NH-Math.min(halfH,NH/2)));
    stage.style.transform='translate('+(vw/2 - camx*zoom)+'px,'+(vh/2 - camy*zoom)+'px) scale('+zoom+')';

    // animate pet
    const spf=1/gAnim.fps; gAnim.t+=dt;
    if(gAnim.t>=spf){ gAnim.t-=spf; gAnim.frame=(gAnim.frame+1)%FRAMES[gAnim.row]; }
    gpet.style.backgroundPosition=(-gAnim.frame*PETF)+'px '+(-gAnim.row*PETF)+'px';
    gpet.style.left=(gx-PETF/2)+'px';
    gpet.style.top =(gy-PETF+1)+'px';
    gpet.classList.toggle('flip',gface<0);
    // behind-object: if pet's head overlaps a tall occluder, drop it below the occluder layer
    gpet.style.zIndex = behindOccluder(gx,gy) ? 9 : 5;
    // pet bubble follows head
    if(petBubble){ petBubble.style.left=gx+'px'; petBubble.style.top=(gy-PETF+2)+'px'; }

    // others
    for(const o of others){
      const odx=o.tx-o.x, ody=o.ty-o.y, od=Math.hypot(odx,ody);
      if(od>2){ const s=Math.min(34*dt,od);
        const [nx,ny]=moveCollide(o.x,o.y, odx/od*s, ody/od*s);
        if(nx===o.x&&ny===o.y){ if(!o.net) pickOther(o); } else { o.x=nx; o.y=ny; }
        o.face=odx<0?-1:1; o.ft+=dt; if(o.ft>1/7){o.ft=0;o.frame=(o.frame+1)%FRAMES[ROW.WALK];}
      } else {
        if(!o.net && now>(o.repick||0)){ pickOther(o); o.repick=now+2000+Math.random()*4000; }
        o.ft+=dt; if(o.ft>1/5){o.ft=0;o.frame=(o.frame+1)%FRAMES[ROW.IDLE];}
      }
      const orow=od>2?ROW.WALK:ROW.IDLE;
      o.el.style.backgroundPosition=(-o.frame*OF)+'px '+(-orow*OF)+'px';
      o.el.style.left=(o.x-OF/2)+'px';
      o.el.style.top =(o.y-OF+1)+'px';
      o.el.classList.toggle('flip',o.face<0);
      o.el.style.zIndex = behindOccluder(o.x,o.y) ? 9 : 4;
      o.lbl.style.left=o.x+'px';
      o.lbl.style.top =(o.y-OF-4)+'px';
      if(o.bub){ o.bub.style.left=o.x+'px'; o.bub.style.top=(o.y-OF+1)+'px'; }
      if(!o.net && now>o.nextChat){
        const line=OTHER_LINES[Math.floor(Math.random()*OTHER_LINES.length)];
        logMsg(o.name, line); bubbleOther(o, line);
        o.nextChat=now+9000+Math.random()*14000;
      }
    }

    if(typeof net!=='undefined' && net.online){ net.sendT=(net.sendT||0)+dt; if(net.sendT>0.12){ net.sendT=0; netSendPos(); } }
    updateZoneHud();
    raf=requestAnimationFrame(gloop);
  }

  function layout(){
    stage.style.width=NW+'px'; stage.style.height=NH+'px';
    gmap.style.width=NW+'px'; gmap.style.height=NH+'px';
  }
  function openGame(){
    if(open) return; open=true;
    if(!mapped){ gmap.src=SCENE; stage.style.setProperty('--scene','url('+SCENE+')'); mapped=true; }
    if(typeof openChat==='function' && !document.getElementById('chat').classList.contains('open')) openChat();
    switchView('game');
    gx=300; gy=470; gtx=gx; gty=gy; gface=1; zoom=2.4; camx=gx; camy=gy;
    for(const k in keys) keys[k]=false;
    glog.innerHTML='';
    logMsg('','🌿 Welcome to Driftwood Cove. WASD or right-click to move Pip.','sys');
    logMsg('','Gather resources by standing still in a spot (every 30s). Tap a stall to trade.','sys');
    buildOccluders(); buildMarkets(); updateCoins(); closeMarket();
    spawnOthers(); scheduleForage(); if(typeof goOnline==='function') setTimeout(goOnline,150);
    layout();
    lastT=performance.now();
    raf=requestAnimationFrame(gloop);
    setTimeout(()=>world.focus&&world.focus(),20);
  }
  function closeGame(){
    if(!open) return; open=false;
    cancelAnimationFrame(raf);
    if(petBubble){ petBubble.remove(); petBubble=null; }
    others.forEach(o=>{ if(o.bub)o.bub.remove(); o.el.remove(); o.lbl.remove(); }); others.length=0; clearTimeout(forageT);
    closeMarket();
  }
  window.addEventListener('keydown',e=>{ if(open && e.key==='Escape'){ closeGame(); switchView('chat'); } });


  /* ---- passive foraging: 30-60s a food drops; 1/200 a cosmetic ---- */
  let forageT=null;
  function scheduleForage(){ clearTimeout(forageT); forageT=setTimeout(doForage, 30000+Math.random()*30000); }
  function doForage(){
    if(!open) return;
    if(Math.random() < 1/200){
      const cats=['hat','face','neck','aura']; const cat=cats[Math.floor(Math.random()*cats.length)];
      const pool=(typeof COSDATA!=='undefined') ? COSDATA[cat] : null;
      if(pool && pool.length){ const it=pool[Math.floor(Math.random()*pool.length)]; pool.push({ic:it.ic,name:it.name});
        popText('✨ '+it.name+'!', gx, gy-PETF*0.6); logMsg('','✨ rare forage — a '+it.name+' cosmetic!','sys');
        if(typeof renderCat==='function') renderCat(); }
    } else {
      const f=FOODS[Math.floor(Math.random()*FOODS.length)]; f.n++;
      popText('+1 '+f.name, gx, gy-PETF*0.5);
      if(typeof renderCat==='function') renderCat();
    }
    scheduleForage();
  }


  /* ===================== REAL MULTIPLAYER ===================== */
  const net={online:false,ws:null,peers:Object.create(null),me:null,sendT:0};
  function relayURL(){ return (localStorage.getItem('p3ts.relay')||'wss://driftwood-cove.lachiejg5.workers.dev'); }
  function myCoveName(){ return (localStorage.getItem('p3ts.name')||'Pip'); }
  function makePeer(id,name,hue,x,y){
    const el=document.createElement('div'); el.className='gother'; el.style.setProperty('--hue',(hue||0)+'deg');
    const lbl=document.createElement('div'); lbl.className='gname'; lbl.textContent=name||'player';
    stage.appendChild(el); stage.appendChild(lbl);
    const o={el,lbl,name:name||'player',x:x||300,y:y||470,tx:x||300,ty:y||470,face:1,frame:0,ft:0,net:true,id:id};
    net.peers[id]=o; others.push(o); updateOnline(); return o;
  }
  function dropPeer(id){
    const o=net.peers[id]; if(!o) return;
    if(o.bub)o.bub.remove(); o.el.remove(); o.lbl.remove();
    const i=others.indexOf(o); if(i>=0) others.splice(i,1);
    delete net.peers[id]; updateOnline();
  }
  function clearBots(){ for(const o of others.slice()){ if(!o.net){ if(o.bub)o.bub.remove(); o.el.remove(); o.lbl.remove(); others.splice(others.indexOf(o),1); } } }
  function handleNet(m){
    if(m.t==='welcome'){ net.me=m.id; clearBots(); (m.peers||[]).forEach(p=>{ if(p.id!==net.me&&!net.peers[p.id]) makePeer(p.id,p.name,p.hue,p.x,p.y); }); updateOnline(); }
    else if(m.t==='join'){ if(m.id!==net.me&&!net.peers[m.id]){ makePeer(m.id,m.name,m.hue,m.x,m.y); logMsg('', (m.name||'someone')+' joined the cove','sys'); } }
    else if(m.t==='pos'){ const o=net.peers[m.id]; if(o){ o.tx=m.x; o.ty=m.y; if(m.face) o.face=m.face; } }
    else if(m.t==='chat'){ const o=net.peers[m.id]; if(o){ logMsg(o.name,m.text); bubbleOther(o,m.text); } }
    else if(m.t==='leave'){ const o=net.peers[m.id]; if(o){ logMsg('', (o.name||'someone')+' left the cove','sys'); dropPeer(m.id); } }
  }
  function netSendPos(){ if(net.ws&&net.ws.readyState===1) net.ws.send(JSON.stringify({t:'pos',x:Math.round(gx),y:Math.round(gy),face:gface})); }
  function netSendChat(t){ if(net.ws&&net.ws.readyState===1) net.ws.send(JSON.stringify({t:'chat',text:t})); }
  function goOffline(){ try{ if(net.ws) net.ws.close(); }catch(_){ } }
  function cleanupNet(){
    net.online=false; net.ws=null;
    for(const id in net.peers) dropPeer(id);
    net.peers=Object.create(null); updateOnline(); updateGoBtn();
    if(open && !others.length) spawnOthers();   // bots return when offline
  }
  function goOnline(){
    if(net.online){ goOffline(); return; }
    let ws; try{ ws=new WebSocket(relayURL()); }catch(e){ logMsg('','⚠ bad relay URL — check settings','sys'); return; }
    net.ws=ws; logMsg('','🌐 connecting to '+relayURL()+' …','sys'); updateGoBtn();
    ws.onopen=()=>{ net.online=true; updateGoBtn();
      ws.send(JSON.stringify({t:'join',name:myCoveName(),hue:Math.floor(60+Math.random()*260),x:Math.round(gx),y:Math.round(gy)}));
      logMsg('','🌐 you are online — real players will appear here','sys'); };
    ws.onmessage=(ev)=>{ let m; try{ m=JSON.parse(ev.data); }catch(_){ return; } handleNet(m); };
    ws.onerror=()=>{ logMsg('','⚠ could not reach the relay. Is it running? (npm run relay)','sys'); };
    ws.onclose=()=>{ if(net.online) logMsg('','🔌 disconnected from the cove','sys'); cleanupNet(); };
  }
  // multiplayer is automatic on entering the cove (no button / not an option)
  function updateGoBtn(){}
  // leaving the game / closing also disconnects
  const _closeGame=closeGame; closeGame=function(){ if(net.online||net.ws) goOffline(); _closeGame(); };

  window.__openSceneGame = openGame;
  window.__closeSceneGame = closeGame;
})();
})();
</script>
<script>
/* ===================== WALLET + CRYPTO COSMETIC SHOP (model a) ===================== */
(function(){
  const wallet={ client:null, modal:null, session:null, chain:null, address:null };
  const ETH_PRICE=0.001, SOL_PRICE=0.02;     // per cosmetic (demo defaults)
  const SOL_CHAIN='solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp';   // solana mainnet
  const $=id=>document.getElementById(id);
  const ls=k=>(localStorage.getItem(k)||'').trim();

  document.body.insertAdjacentHTML('beforeend',
    '<div id="wshop"><div class="wcard">'
    +'<div class="whd">💎 Cosmetics Shop <button class="wx" id="wclose">✕</button></div>'
    +'<div class="wwallet" id="wwallet"></div>'
    +'<div class="wgrid" id="wgrid"></div>'
    +'<div class="wnote" id="wnote"></div></div></div>');
  function note(t){ const n=$('wnote'); if(n) n.textContent=t||''; }
  function openShop(){ renderWallet(); $('wshop').classList.add('show'); if(window.pip&&window.pip.setIgnore) window.pip.setIgnore(false); }
  function closeShop(){ $('wshop').classList.remove('show'); }
  $('wclose').onclick=closeShop;
  $('wshop').addEventListener('click',e=>{ if(e.target.id==='wshop') closeShop(); });

  function catalog(){ const out=[],seen={}; const C=(typeof COSDATA!=='undefined')?COSDATA:{};
    ['hat','face','neck','aura'].forEach(cat=>{ (C[cat]||[]).forEach(it=>{ if(!seen[it.name]){ seen[it.name]=1; out.push({cat,ic:it.ic,name:it.name}); } }); });
    return out; }
  function buildShop(){ const g=$('wgrid'); if(!g) return; g.innerHTML='';
    const price = wallet.chain==='sol' ? ('◎ '+SOL_PRICE) : ('Ξ '+ETH_PRICE);
    catalog().forEach(item=>{ const d=document.createElement('div'); d.className='witem';
      d.innerHTML='<img src="data:image/png;base64,'+item.ic+'"/><div class="wn">'+item.name+'</div><button class="wbuy">'+price+'</button>';
      d.querySelector('.wbuy').onclick=()=>buy(item); g.appendChild(d); }); }
  function renderWallet(){ const w=$('wwallet'); if(!w) return;
    if(wallet.session && wallet.address){ const a=wallet.address, short=a.slice(0,6)+'…'+a.slice(-4);
      w.innerHTML='<span class="wpill">🟢 '+(wallet.chain==='sol'?'Phantom':'MetaMask')+': '+short+'</span><button class="wdis" id="wdisc">Disconnect</button>';
      $('wdisc').onclick=disconnect;
    } else {
      w.innerHTML='<button class="wconn" data-c="evm">Connect MetaMask</button><button class="wconn" data-c="sol">Connect Phantom</button>';
      w.querySelectorAll('.wconn').forEach(b=>b.onclick=()=>connect(b.dataset.c));
    }
    buildShop(); }

  async function wcInit(){
    if(wallet.client) return wallet.client;
    const pid=ls('p3ts.wcpid'); if(!pid) throw new Error('Add a WalletConnect Project ID in settings.');
    note('loading wallet library…');
    const [sc,md]=await Promise.all([ import('https://esm.sh/@walletconnect/sign-client@2.17.2'), import('https://esm.sh/@walletconnect/modal@2.7.0') ]);
    wallet.client=await sc.SignClient.init({ projectId:pid, metadata:{ name:'P3TS Pet', description:'Driftwood Cove cosmetics', url:'https://driftwood-cove.lachiejg5.workers.dev', icons:[] } });
    wallet.modal=new md.WalletConnectModal({ projectId:pid }); note(''); return wallet.client;
  }
  async function connect(chain){
    try{ const client=await wcInit();
      const ns = chain==='sol'
        ? { solana:{ methods:['solana_signAndSendTransaction'], chains:[SOL_CHAIN], events:[] } }
        : { eip155:{ methods:['eth_sendTransaction'], chains:['eip155:1'], events:['accountsChanged','chainChanged'] } };
      const { uri, approval }=await client.connect({ requiredNamespaces:ns });
      if(uri) wallet.modal.openModal({ uri });
      note('approve in your wallet app…');
      const session=await approval(); try{ wallet.modal.closeModal(); }catch(_){}
      wallet.session=session; wallet.chain=chain;
      const acct = chain==='sol' ? session.namespaces.solana.accounts[0] : session.namespaces.eip155.accounts[0];
      wallet.address=acct.split(':').pop(); note(''); renderWallet();
    }catch(e){ try{ wallet.modal&&wallet.modal.closeModal(); }catch(_){ } note('✕ '+((e&&e.message)||'connect failed')); }
  }
  function disconnect(){ try{ if(wallet.client&&wallet.session) wallet.client.disconnect({ topic:wallet.session.topic, reason:{code:6000,message:'user'} }); }catch(_){}
    wallet.session=null; wallet.address=null; wallet.chain=null; renderWallet(); }
  async function payEVM(to,eth){ const wei=BigInt(Math.round(eth*1e18));
    return wallet.client.request({ topic:wallet.session.topic, chainId:'eip155:1',
      request:{ method:'eth_sendTransaction', params:[{ from:wallet.address, to:to, value:'0x'+wei.toString(16) }] } }); }
  async function paySOL(to,sol){ const web3=await import('https://esm.sh/@solana/web3.js@1.95.3');
    const conn=new web3.Connection('https://api.mainnet-beta.solana.com','confirmed');
    const fromPk=new web3.PublicKey(wallet.address), toPk=new web3.PublicKey(to);
    const { blockhash }=await conn.getLatestBlockhash();
    const tx=new web3.Transaction({ recentBlockhash:blockhash, feePayer:fromPk })
      .add(web3.SystemProgram.transfer({ fromPubkey:fromPk, toPubkey:toPk, lamports:Math.round(sol*1e9) }));
    const ser=tx.serialize({ requireAllSignatures:false });
    const b64=(typeof Buffer!=='undefined')?Buffer.from(ser).toString('base64'):btoa(String.fromCharCode.apply(null,ser));
    return wallet.client.request({ topic:wallet.session.topic, chainId:SOL_CHAIN, request:{ method:'solana_signAndSendTransaction', params:{ transaction:b64 } } }); }
  async function buy(item){
    if(!wallet.session){ note('connect a wallet first'); return; }
    const sol=wallet.chain==='sol'; const to= sol?ls('p3ts.solrecv'):ls('p3ts.ethrecv');
    if(!to){ note('no receiving '+(sol?'SOL':'ETH')+' address set (settings)'); return; }
    try{ note('confirm the payment in your wallet…');
      if(sol) await paySOL(to,SOL_PRICE); else await payEVM(to,ETH_PRICE);
      const C=(typeof COSDATA!=='undefined')?COSDATA:null; if(C&&C[item.cat]) C[item.cat].push({ic:item.ic,name:item.name});
      if(typeof renderCat==='function') renderCat();
      note('✅ purchased '+item.name+'!');
    }catch(e){ note('✕ '+((e&&e.message)||'payment cancelled')); }
  }
  // 💎 button in the cove HUD
  (function(){ const z=document.getElementById('gzoom'); if(z&&!document.getElementById('wopen')){
    const b=document.createElement('button'); b.id='wopen'; b.className='gzbtn'; b.textContent='💎'; b.title='Cosmetics shop'; b.onclick=openShop; z.prepend(b); } })();
  window.__openShop=openShop;
})();
</script>
</body>
</html>
